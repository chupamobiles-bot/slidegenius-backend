name: slidegenius
description: OfficePilot AI — Presentations, Documents & CV Maker
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.3
  open_filex: ^4.3.4
  share_plus: ^7.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0F0F1A"
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#0F0F1A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

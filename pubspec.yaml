name: slidegenius
description: SlideGenius — AI Presentation, CV & Document Maker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.3
  open_filex: ^4.3.4
  share_plus: ^7.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

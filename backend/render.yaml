services:
  - type: web
    name: slidegenius-api
    env: node
    plan: free
    buildCommand: npm install && curl -fsSL https://raw.githubusercontent.com/iOfficeAI/OfficeCLI/main/install.sh | bash
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
